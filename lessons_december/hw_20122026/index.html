<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Анкета разработчика</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<form action="https://submit-form.com/xNHol7NZ1">
    <h2>Анкета разработчика</h2>
    <fieldset>
        <label class="label-name" for="name">Как Вас зовут?<br></label>
        <input type="text" id="name" name="name" placeholder="Введите Ваше имя" >
    </fieldset>

    <fieldset>
        <legend>Какой у Вас основной язык программирования?</legend>

        <input type="radio" name="radio" id="radio1">
        <label for="radio1">JavaScript/TypeScript <br></label>

        <input type="radio" name="radio" id="radio2">
        <label for="radio2">Python <br></label>

        <input type="radio" name="radio" id="radio3">
        <label for="radio3">Java <br></label>

        <input type="radio" name="radio" id="radio4">
        <label for="radio4">Go</label>
    </fieldset>

    <fieldset>
        <legend>Какие фреймворки использовали?</legend>
        <input type="checkbox" id="checkbox1" name="checkbox">
        <label for="checkbox1">React </label>
        <input type="checkbox" id="checkbox2" name="checkbox">
        <label for="checkbox2">Angular <br></label>
        <input type="checkbox" id="checkbox3" name="checkbox">
        <label for="checkbox3">Spring Boot</label>
        <input type="checkbox" id="checkbox4" name="checkbox">
        <label for="checkbox4">Vue.js <br></label>
        <input type="checkbox" id="checkbox5" name="checkbox">
        <label for="checkbox5">Django </label>
        <input type="checkbox" id="checkbox6" name="checkbox">
        <label for="checkbox6">Svelte</label>
    </fieldset>

    <fieldset>
        <legend>Вы работаете удаленно?</legend>
        <input type="radio" name="work" id="work1">
        <label for="work1"> Да</label>
        <input type="radio" name="work" id="work2">
        <label for="work2">Нет</label>
    </fieldset>
    <fieldset>
        <label class="label-self" for="self"> Расскажите о себе <br></label>
        <input class="input-self" type="text" name="self" id="self" placeholder="Ваши хобби,интересы...">
        <br>

    </fieldset>

    <input class="submit" type="submit" name="submit" id="submit">


</form>
</body>
</html>
