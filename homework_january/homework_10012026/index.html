<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Corporate Event</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="card">
<header class="header">
    <h1>Corporate Event</h1>
    <h3>Register your company for our exclusive business summit</h3>
</header>

<form action="#" class="form">
    <div class="form__name">
        <label class="label_name"  for="name"></label>
        <input type="text"
               name="name"
               id="name"
               placeholder="Company Name"
               required>
    </div>

    <div class="form__department">
        <label for="department"></label>
        <select name="department"
                id="department"
                required>
            <option value="">Department</option>
        </select>
    </div>
    <br>

    <div class="form__contacts">
        <label class="label_contacts" for="contacts"></label>
        <input type="text"
               name="contacts"
               id="contacts"
               placeholder="Contacts"
               required>
    </div>

    <div class="form__email">
        <label for="email" class="label_email"></label>
        <input type="text"
               placeholder="Email Address"
               name="email"
               id="email"
               required>
    </div>

    <br>
    <div class="form__phone">
        <label class="label_phone" for="phone"></label>
        <input type="text"
               placeholder="Phone Number"
               name="phone"
               id="phone"
               required>
    </div>

    <div class="form__tax">
        <label class="label_tax"></label>
        <input type="text"
               placeholder="Company Tax ID"
               name="tax"
               id="tax"
               required>
    </div>

    <br>

    <div class="form__billing">
        <label class="label_billing" for="billing">Billing Address</label>
        <textarea required name="billing" id="billing" cols="30" rows="10"></textarea>
    </div>

    <br>
    <button type="submit" class="submit">
    Register Company
    </button>


</form>


</body>
</html>
